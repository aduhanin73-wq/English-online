<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English для DevSecOps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital@0;1&family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0F4; --surface:#FFFFFF; --ink:#18233D; --muted:#5D6880; --line:#D5DBE5;
  --mark:#F5C842; --ok:#23795A; --bad:#B83A2A; --accent:#2747B8; --accent-ink:#FFFFFF;
  --soft:#E3E8F1;
  --f-head:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-ipa:"Gentium Book Plus","Charis SIL","Doulos SIL","Noto Serif","Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10151F; --surface:#19202D; --ink:#E7EBF3; --muted:#93A0B8; --line:#2A3446;
    --mark:rgba(245,200,66,.42); --ok:#4FBF8F; --bad:#E27463; --accent:#8EA6FF; --accent-ink:#0F1730;
    --soft:#212A3A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10151F; --surface:#19202D; --ink:#E7EBF3; --muted:#93A0B8; --line:#2A3446;
  --mark:rgba(245,200,66,.42); --ok:#4FBF8F; --bad:#E27463; --accent:#8EA6FF; --accent-ink:#0F1730;
  --soft:#212A3A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:680px;margin:0 auto;padding:20px 18px 110px}
h1,h2,h3{font-family:var(--f-head);font-weight:500;line-height:1.2;margin:0}
h1{font-size:1.55rem}
h2{font-size:1.2rem}
h3{font-size:1rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.stack>*+*{margin-top:14px}
.ipa{font-family:var(--f-ipa);font-size:1.05em;color:var(--muted)}
.hl{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%);padding:0 .08em}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:10px 2px 12px;font-size:.74rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:600}
nav.tabs button[aria-current="page"] svg{color:var(--accent)}

/* blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding:8px 10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:38px;height:38px;display:inline-grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:.875rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
input[type=text],textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:70px}
label.f{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.tag{font-size:.75rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:currentColor}
.tag.now{color:var(--accent);border-color:currentColor}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);padding:4px 0;margin-bottom:10px}

/* home */
.hello{padding:8px 0 4px}
.hello h1{font-size:1.7rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--f-head);font-weight:500;font-size:1.4rem}
.stat span{font-size:.8rem;color:var(--muted)}
.next{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.next .k{font-size:.8rem;color:var(--muted)}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 20px 22px;text-align:center;min-height:260px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.card .word{font-family:var(--f-head);font-weight:700;font-size:clamp(1.9rem,8vw,2.8rem);line-height:1.15;word-break:break-word}
.card .ipa{font-size:1.35rem}
.card .ru{font-size:1.15rem;font-weight:500}
.card .ex{color:var(--muted)}
.card .forms{font-family:var(--f-ipa);font-size:1.1rem}
.reveal{border:1px dashed var(--line);background:none;border-radius:10px;padding:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.progress-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.progress-top .bar{flex:1}

/* list */
.list{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.item{border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item>button.head{width:100%;background:none;border:0;text-align:left;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.item .w{font-weight:600}
.item .t{grid-column:1/2;color:var(--muted);font-size:.9rem}
.item .s{grid-row:1/3;grid-column:2;align-self:center}
.item .body{padding:0 14px 14px;font-size:.92rem}
.item .body p+p{margin-top:6px}
.pack{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:block}
.pack+.pack{margin-top:10px}

/* quiz */
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.why{font-size:.9rem;color:var(--muted)}

/* grammar */
.formula{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:baseline}
.formula .sg{font-family:var(--f-head);font-size:.85rem;color:var(--accent);min-width:22px;max-width:80px;text-align:left;line-height:1.25}
.formula code{font-family:var(--f-body);font-weight:600}
.formula .e{grid-column:2;color:var(--muted);font-size:.92rem;margin-bottom:6px}
.mistake{border-left:3px solid var(--bad);padding:4px 0 4px 12px}
.mistake s{color:var(--bad)}
.mistake b{color:var(--ok)}
.topic{width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 14px;display:flex;gap:12px;align-items:center;text-align:left}
.topic:first-child{border-top:0}
.topic .n{font-family:var(--f-head);font-size:.85rem;color:var(--muted);width:22px;flex:none}
.topic .tt{flex:1}
.topic .tt small{display:block;color:var(--muted);font-size:.82rem}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.cheat{border-collapse:collapse;font-size:.85rem;min-width:620px}
table.cheat th,table.cheat td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.cheat th{font-weight:600;color:var(--muted)}
table.cheat td:first-child{font-weight:600;white-space:nowrap}
.ai-out{white-space:pre-wrap;font-size:.95rem;background:var(--paper);border-radius:10px;padding:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:20;max-width:90vw}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){
  .card.flip{animation:pop .22s ease-out}
  @keyframes pop{from{transform:scale(.97);opacity:.6}to{transform:none;opacity:1}}
}

.lvl-h{display:flex;align-items:baseline;gap:10px;margin:22px 0 8px}
.lvl-h h2{font-size:1.05rem}
.lvl-h span{font-size:.85rem;color:var(--muted)}
.uses{display:grid;gap:10px}
.uses div p:first-child{font-weight:600}
.uses div p+p{color:var(--muted);font-size:.93rem}
.note{background:color-mix(in srgb,var(--mark) 22%,var(--surface));border-radius:10px;padding:10px 12px;font-size:.92rem}
table.irr{border-collapse:collapse;width:100%;min-width:430px;font-size:.92rem}
table.irr td,table.irr th{border-bottom:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:middle}
table.irr th{color:var(--muted);font-weight:600;font-size:.82rem}
table.irr td:first-child{font-weight:600}
table.irr .ipa{font-weight:400}
table.irr .icon-btn{width:30px;height:30px}
table.irr .icon-btn svg{width:15px;height:15px}
.cons{display:grid;gap:12px}
.cons div{border-top:1px solid var(--line);padding-top:10px}
.cons div:first-child{border-top:0;padding-top:0}
.cons b{display:block}
.cons .ru{color:var(--muted);font-size:.9rem}
.cons .e{font-size:.93rem;margin-top:2px}
.total{font-family:var(--f-head);font-weight:500}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps span{font-size:.72rem;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.steps span.ok{background:color-mix(in srgb,var(--ok) 18%,var(--surface));color:var(--ok)}
.steps span.now{background:var(--accent);color:var(--accent-ink)}
.today{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:20px 18px}
.today h2{font-weight:700}
details summary{cursor:pointer;list-style-position:inside}
textarea#trin{font-size:1.05rem}
#wt{position:fixed;inset:0;z-index:30}
#wt[hidden]{display:none}
.wt-back{position:absolute;inset:0;background:rgba(10,15,30,.35)}
.wt-sheet{position:absolute;left:0;right:0;bottom:0;max-width:680px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(0,0,0,.18)}
@media (prefers-reduced-motion:no-preference){.wt-sheet{animation:wtup .18s ease-out}@keyframes wtup{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}}
.wt-w{font-family:var(--f-head);font-weight:700;font-size:1.6rem;line-height:1.2}
.wt-ru{font-size:1.15rem;font-weight:500;margin:10px 0 6px}
.tip{font-size:.85rem;color:var(--muted);border-left:3px solid var(--mark);padding-left:10px}
#ds{position:fixed;inset:0;z-index:30}
#ds[hidden]{display:none}
#ds .wt-sheet{max-height:90vh;overflow-y:auto}
.syncst{font-size:.8rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.syncst::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.syncst[data-s="Синхронизировано"]::before,.syncst[data-s="Сохранено"]::before{background:var(--ok)}
.syncst[data-s="Сохраняю…"]::before{background:var(--mark)}
</style>
</head>

, believe, mean — это состояния, а не действия. Их не ставят в -ing, даже если по-русски «сейчас».","keys":[["know / need / understand — без -ing","I don't understand. What does it mean?"]],"words":[["believe","/bɪˈliːv/","верить","I believe you.",""],["understand","/ˌʌndəˈstænd/","понимать","I understand the task.","understand – understood – understood"],["mean","/miːn/","значить, иметь в виду","","mean – meant – meant"],["prefer","/prɪˈfɜː/","предпочитать","I prefer Linux.",""],["seem","/siːm/","казаться","It seems easy.",""]],"quiz":[["I ___ what you mean.","understand","am understanding","understanding","Глагол состояния — Simple."]],"tr":[["Я не понимаю эту задачу.",["I don't understand this task."]],["Я предпочитаю Linux.",["I prefer Linux."]],["Что значит это слово?",["What does this word mean?"]]],"task":"Напиши 4 предложения о своих предпочтениях и мнениях (prefer, like, believe, need)."},{"type":"L","title":"Своё мнение","topic":"c:Мнение и согласие","focus":"Глаголы состояния подводят к мнению. Его начинают с I think, In my opinion, It seems. Важно: «думаю, что не…» по-английски — I don't think…","keys":[["I think… · I don't think… · In my opinion…","I don't think it will work."]],"words":[["opinion","/əˈpɪnjən/","мнение","In my opinion, it's a good idea.",""],["agree","/əˈɡriː/","соглашаться","I agree with you.",""],["sure","/ʃʊə/","уверенный","I'm sure it works.",""],["idea","/aɪˈdɪə/","идея","That's a good idea.",""],["important","/ɪmˈpɔːtnt/","важный","This is very important.",""]],"quiz":[["«Кажется, сервер упал»","It seems the server is down.","It seems that server down.","Seems the server is down it.","It seems (that) + полное предложение."],["«Я согласен с тобой»","I agree with you.","I am agree with you.","I agree to you.","agree — глагол, am не нужен."],["«Думаю, это не сработает»","I don't think it will work.","I think it won't work not.","I think it doesn't will work.","Отрицание ставится в начало: I don't think."]],"tr":[["По-моему, это хорошая идея.",["In my opinion, it is a good idea.","In my opinion, this is a good idea."]],["Я не уверен.",["I'm not sure.","I am not sure."]],["Я согласен с тобой.",["I agree with you."]]],"task":"Выскажи мнение (4–5 предложений): где лучше учиться — дома или в библиотеке? Используй I think, In my opinion, I agree."},{"type":"L","title":"Предложить и посоветовать","topic":"c:Совет и предложение","focus":"От мнения — к совету. You should — тебе стоит, Why don't we…? — почему бы нам не, Let's — давай.","keys":[["You should… · Why don't we…? · Let's…","You should try Linux. Let's go together."]],"words":[["suggest","/səˈdʒest/","предлагать","I suggest a new approach.",""],["advice","/ədˈvaɪs/","совет","Can you give me some advice?",""],["try","/traɪ/","пытаться, пробовать","Try again.",""],["maybe","/ˈmeɪbi/","может быть","Maybe tomorrow.",""],["together","/təˈɡeðə/","вместе","Let's go together.",""]],"quiz":[["«Тебе стоит попробовать»","You should try it.","You should to try it.","You should trying it.","should + базовая форма."],["«Почему бы нам не использовать Docker?»","Why don't we use Docker?","Why we don't use Docker?","Why not we use Docker?","Why don't we + глагол?"],["«Как насчёт встречи в пятницу?»","How about meeting on Friday?","How about meet on Friday?","How about to meet on Friday?","How about + -ing."]],"tr":[["Давай пойдём вместе.",["Let's go together."]],["Почему бы нам не использовать Docker?",["Why don't we use Docker?"]],["Тебе стоит попробовать Linux.",["You should try Linux."]]],"task":"Друг жалуется, что не успевает учиться. Дай ему 4 совета (You should, Why don't you, How about, Let's)."},{"type":"R","title":"Итоги недели 4","topic":"","focus":"","keys":[],"words":[],"quiz":[],"tr":[["Я сейчас занят, я пишу код.",["I am busy now, I am writing code.","I'm busy right now, I'm writing code."]],["Обычно он работает дома, но на этой неделе работает в офисе.",["He usually works at home, but this week he is working in the office.","He usually works from ided to learn Go.",""]],"quiz":[],"tr":[["Я обещаю, я помогу тебе.",["I promise I will help you.","I promise, I'll help you."]],["Скоро всё будет хорошо.",["Everything will be fine soon.","Soon everything will be fine.","Everything will be OK soon."]],["В будущем я, вероятно, буду работать в DevSecOps.",["In the future I will probably work in DevSecOps.","I'll probably work in DevSecOps in the future."]]],"task":"Напиши 5 прогнозов: каким будет IT через 10 лет (will / won't)."},{"type":"L","title":"going to: планы","topic":"fut","focus":"Если решение уже принято заранее — это план, и нужен going to: am/is/are + going to + глагол.","keys":[["am/is/are going to + глагол","I'm going to apply for an internship."]],"words":[["plan","/plæn/","план; планировать","What are your plans for the weekend?",""],["apply","/əˈplaɪ/","подавать заявку","I'm going to apply for an internship.",""],["internship","/ˈɪntɜːnʃɪp/","стажировка","I want an internship this summer.",""],["save","/seɪv/","сохранять; копить","Save your work often.",""],["summer","/ˈsʌmə/","лето","In summer I have a holiday.",""]],"quiz":[],"tr":[["Летом я собираюсь пройти стажировку.",["I'm going to do an internship in summer.","In summer I'm going to do an internship.","I am going to do an internship this summer."]],["Я собираюсь копить на новый компьютер.",["I'm going to save for a new computer.","I am going to save money for a new computer."]],["Что ты собираешься делать после университета?",["What are you going to do after university?"]]],"task":"Напиши свои планы на следующие 6 месяцев (5 предложений с going to)."},{"type":"L","title":"Договорённости","topic":"fut","focus":"Третий способ: если уже договорился и есть время/место — Present Continuous. I'm meeting him at 6.","keys":[["am/is/are + V-ing + когда","I'm meeting my friends tonight."]],"words":[["appointment","/əˈpɔɪntmənt/","запись (к врачу и т.п.)","I have a dentist appointment.",""],["dentist","/ˈdentɪst/","стоматолог","I'm afraid of the dentist." n/","упоминать","He mentioned the deadline.",""],["deadline","/ˈdedlaɪn/","крайний срок","The deadline is on Friday.",""],["announce","/əˈnaʊns/","объявлять","They announced a new release.",""]],"quiz":[],"tr":[["Он сказал, что устал.",["He said that he was tired.","He said he was tired."]],["Преподаватель сказал нам, что экзамен в пятницу.",["The teacher told us that the exam was on Friday.","The teacher told us the exam was on Friday.","The teacher said that the exam was on Friday."]],["Она упомянула, что дедлайн перенесли.",["She mentioned that the deadline had been moved.","She mentioned that the deadline had been postponed.","She mentioned that the deadline was moved."]]],"task":"Перескажи недавний разговор с другом или преподавателем: кто что сказал (5 предложений в косвенной речи)."},{"type":"L","title":"Он спросил, …","topic":"reported","focus":"Пересказываем вопросы и просьбы: asked if/whether — спросил, ли; asked where… — с прямым порядком слов; asked me to… — попросил.","keys":[["asked if… · asked where I worked · asked me to + глагол","The manager asked me to restart the server."]],"words":[["ask","/ɑːsk/","спрашивать, просить","Can I ask you something?",""],["wonder","/ˈwʌndə/","интересоваться, задаваться вопросом","I wonder why it failed.",""],["whether","/ˈweðə/","ли","He asked whether I was ready.",""],["politely","/pəˈlaɪtli/","вежливо","He asked politely.",""],["recruiter","/rɪˈkruːtə/","рекрутер","A recruiter called me.",""]],"quiz":[],"tr":[["Он спросил, где я работаю.",["He asked where I worked.","He asked me where I worked."]],["Она спросила, готов ли я.",["She asked if I was ready.","She asked whether I was ready.","She asked me if I was ready."]],["Менеджер попросил меня перезапустить сервер.",["The manager asked me to restart the server."]]],"task":"Тебе звонил рекрутер. Перескажи его вопросы и просьбы (5 предложений: asked if…, asked where…, asked me to…)."},{"type":"L","title":"Буду в процессе","topic":"futcont","focus":"Из прошлого — снова в будущее, но глубже: will be + -ing = «буду в процессе» в конкретный момент.","keys":[["will be + V-ing","This time tomorrow I'll be flying to Sochi."]],"words":[["this time tomorrow","/ðɪs taɪm təˈmɒrəʊ/","завтра в это время","This time tomorrow I'll be flying.",""],["fly","/flaɪ/","летать","","fly – flew – flown"],["beach","/biːtʃ/","пляж","I'll be lying on the beach.",""],["lie","/laɪ/","лежать","I like to lie on the beach.",""],["flight","/flaɪt/","рейс, полёт","My flight is at 10 pm.",""]],"quiz":[],"tr":[["Завтра в это время я буду лететь в Сочи.",["This time tomorrow I will be flying to Sochi.","This time tomorrow I'll be flying to Sochi."]],["Не звони в три, я буду сдавать экзамен.",["Don't call at three, I will be taking an exam.","Don't call at 3, I'll be taking an exam.","Don't call at three, I'll be taking the exam."]],["Ты будешь пользоваться ноутбуком вечером?",["Will you be using the laptop tonight?","Will you be using the laptop this evening?"]]],"task":"Опиши, что ты будешь делать завтра в разное время дня (5 предложений: At 9 I'll be…)."},{"type":"L","title":"Смогу, привык, удалось","topic":"c:Умение, необходимость, привычка","focus":"Расширяем can и must для любых времён: be able to (смогу), manage to (удалось), be used to + -ing (привык).","keys":[["will be able to · managed to · be used to + V-ing","I managed to fix the server."]],"words":[["be able to","/bi ˈeɪbl tuː/","быть в состоянии","I'll be able to help tomorrow.",""],["be used to","/bi ˈjuːst tuː/","быть привыкшим","I'm used to working at night.",""],["no need","/nəʊ ˈniːd/","нет нужды","There's no need to worry.",""],["manage to","/ˈmænɪdʒ tuː/","суметь, удаться","I managed to fix it.",""],["need","/niːd/","нуждаться, нужно","I need help.",""]],"quiz":[["Tomorrow I ___ help you.","will be able to","will can","can will","В будущем can → will be able to."],["I'm used to ___ at night.","working","work","worked","be used to + -ing."],["I managed ___ the server.","to fix","fixing","fix","manage to + глагол."]],"tr":[["Завтра я смогу тебе помочь.",["I will be able to help you tomorrow.","I'll be able to help you tomorrow."]],["Я привык работать ночью.",["I'm used to working at night.","I am used to working at night."]],["Мне удалось починить сервер.",["I managed to fix the server.","I managed to repair the server."]]],"task":"Напиши 5 предложений о своих возможностях и привычках (be able to, be used to, managed to, need to)."},{"type":"R","title":"Итоги недели 12","topic":"","focus":"","keys":[],"words":[],"quiz":[],"tr":[["Когда я проснулся, все уже ушли.",["When I woke up, everyone had already left.","When I woke up, everybody had already left."]],["Он сказал, что поможет.",["He said that he would help.","He said he would help."]],["Она спросила, где я живу.",["She asked where I lived.","She asked me where I lived."]],["В восемь я буду ехать домой.",["At eight I will be going home.","At 8 I'll be going home.","At eight I'll be driving home."]]],"task":"Перескажи кусок фильма или сериала (6–8 предложений): события, предысторию и кто что сказал."}]},{"title":"Если бы…","desc":"Second и Third Conditional, wish, связки","lessons":[{"type":"L","title":"Если бы сейчас…","topic":"cond2","focus":"Ты уже знаешь реальные условия (If I pass, I'll…). Теперь нереальные: «если бы…». После if — Past Simple, в главной части — would.","keys":[["If + Past, would + глагол","If I had a million, I would buy an island."]],"words":[["rich","/rɪtʃ/","богатый","If I were rich, I'd travel.",""],["million","/ˈmɪljən/","миллион","A million downloads.",""],["choice","/tʃɔɪs/","выбор","I had no choice.",""],["island","/ˈaɪlənd/","остров","They live on an island.",""],["would","/wʊd/","бы (вспомогательный)","I would help you.",""]],"quiz":[],"tr":[["Если бы у меня был миллион, я бы купил остров.",["If I had a million, I would buy an island.","If I had a million, I'd buy an island."]],["Если бы я жил у моря, я бы плавал каждый день.",["If I lived by the sea, I would swim every day.","If I lived near the sea, I'd swim every day."]],["Что бы ты сделал на моём месте?",["What would you do if you were me?","What would you do in my place?"]]],"task":"Напиши 5 предложений: что бы ты сделал, если бы… (был богат, жил в другой стране, мог выбрать любую работу)."},{"type":"L","title":"На твоём месте… и wish","topic":"cond2","focus":"Два частых применения: совет If I were you, I'd… и сожаление о настоящем I wish + Past («жаль, что не…»).","keys":[["If I were you, I'd… · I wish + Past","I wish I had more time."]],"words":[["wish","/wɪʃ/","желать; жаль, что","I wish I had more time.",""],["regret","/rɪˈɡret/","сожалеть","I don't regret it.",""],["if I were you","/ɪf aɪ wɜː ˈjuː/","на твоём месте","If I were you, I'd rest.",""],["situation","/ˌsɪtʃuˈeɪʃn/","ситуация","It's a difficult situation.",""],["honestly","/ˈɒnɪstli/","честно","Honestly, I don't know.",""]],"quiz":[],"tr":[["На твоём месте я бы взял эту работу.",["If I were you, I would take this job.","If I were you, I'd take this job.","If I were you, I'd take the job."]],["Жаль, что у меня нет больше времени.",["I wish I had more time."]],["Жаль, что я не знаю немецкий.",["I wish I knew German."]]],"task":"Напиши 3 «I wish…» о своей жизни и дай 2 совета другу через «If I were you…»."},{"type":"L","title":"Если бы тогда…","topic":"cond3","focus":"Последняя ступень: нереальное прошлое — «если бы тогда…, то…». If + had V3, would have V3. Сожаления и разбор ошибок.","keys":[["If + had V3, would have V3","If we had made a backup, we wouldn't have lost the data."]],"words":[["mistake","/mɪˈsteɪk/","ошибка","Everyone makes mistakes.",""],["chance","/tʃɑːns/","шанс","I missed my chance.",""],["otherwise","/ˈʌðəwaɪz/","иначе","Save it, otherwise you'll lose it.",""],["luckily","/ˈlʌkɪli/","к счастью","Luckily, we had a backup.",""],["earlier","/ˈɜːliə/","раньше","I should have started earlier.",""]],"quiz":[],"tr":[["Если бы я начал раньше, я бы успел.",["If I had started earlier, I would have finished in time.","If I had started earlier, I'd have finished on time.","If I had started earlier, I would have made it."]],["Если бы мы сделали бэкап, мы бы не потеряли данные.",["If we had made a backup, we wouldn't have lost the data.","If we had backed up, we would not have lost the data."]],["К счастью, у нас был бэкап.",["Luckily, we had a backup."]]],"task":"Вспомни свою ошибку: напиши 4 предложения «если бы тогда…, то…»."},{"type":"L","title":"Разбор инцидента","topic":"cond3","focus":"Third Conditional — основа postmortem: разбор инцидента без поиска виноватых. Что случилось, почему, что помогло бы, что сделаем дальше.","keys":[["Root cause: …","The root cause was an expired certificate."],["If we had…, we would have…","If we had monitored it, we would have noticed earlier."],["Action items: we will…","We will add alerts."]],"words":[["root cause","/ˌruːt ˈkɔːz/","первопричина","We found the root cause.",""],["expire","/ɪkˈspaɪə/","истекать (о сроке)","The certificate expired.",""],["timeline","/ˈtaɪmlaɪn/","хронология","Here is the timeline.",""],["impact","/ˈɪmpækt/","влияние, последствия","The impact was small.",""],["prevent","/prɪˈvent/","предотвращать","How can we prevent it?",""]],"quiz":[["«Если бы мы следили, мы бы заметили»","If we had monitored it, we would have noticed.","If we monitored it, we would notice it had.","If we would have monitored, we had noticed.","Третий тип: had V3 → would have V3."]],"tr":[["Первопричиной был просроченный сертификат.",["The root cause was an expired certificate."]],["Если бы у нас были оповещения, мы бы заметили раньше.",["If we had had alerts, we would have noticed earlier.","If we had had alerts, we'd have noticed earlier."]],["Как нам предотвратить это в будущем?",["How can we prevent this in the future?","How can we prevent it in the future?"]]],"task":"Напиши короткий postmortem (6–8 предложений): что случилось, первопричина, последствия, что помогло бы, что сделаем дальше."},{"type":"L","title":"Все условные вместе","topic":"cond1","focus":"Собираем систему: 0 — всегда правда, 1 — реально в будущем, 2 — нереально сейчас, 3 — нереально в прошлом. Выбор зависит от того, насколько это реально и когда.","keys":[["0: If + Present, Present","If you heat ice, it melts."],["1: If + Present, will","If it rains, I'll stay home."],["2: If + Past, would","If I had time, I'd learn Rust."],["3: If + had V3, would have V3","If I had studied, I would have passed."]],"words":[["real","/rɪəl/","реальный","Is it a real problem?",""],["imagine","/ɪˈmædʒɪn/","представлять","Imagine you're rich.",""],["condition","/kənˈdɪʃn/","условие","Check the condition.",""],["possible","/ˈpɒsəbl/","возможный","Is it possible?",""],["case","/keɪs/","случай","In case of fire, leave the building.",""]],"quiz":[["If it ___ tomorrow, we'll stay home.","rains","rained","would rain","Первый тип: реально."],["If I ___ you, I'd learn Python.","were","am","had been","Второй тип: If I were you."],["If you heat water, it ___.","boils","will boiled","would boil","Нулевой тип: факт."],["If he had asked, I ___ him.","would have helped","will help","helped","Третий тип."]],"tr":[["Если пойдёт дождь, я останусь дома.",["If it rains, I will stay at home.","If it rains, I'll stay home.","If it rains, I'll stay at home."]],["Если бы я знал ответ, я бы сказал тебе.",["If I knew the answer, I would tell you.","If I knew the answer, I'd tell you."]],["Представь, что ты руководитель.",["Imagine you are a manager.","Imagine that you're a manager."]]],"task":"Напиши по одному предложению каждого типа (0, 1, 2, 3) про IT и одно — про свою жизнь."},{"type":"L","title":"Связки для взрослой речи","topic":"-","focus":"Чтобы рассуждать связно: although — хотя, however — однако, moreover — кроме того, therefore — поэтому, instead — вместо этого.","keys":[["Although + предложение, …","Although it's late, I'm still working."],["… . However, …","It works. However, it's slow."],["On the one hand… On the other hand…","On the one hand it's cheap. On the other hand it's slow."]],"words":[["although","/ɔːlˈðəʊ/","хотя","Although it's late, I'm still working.",""],["however","/haʊˈevə/","однако","It works. However, it is slow.",""],["moreover","/mɔːˈrəʊvə/","кроме того","Moreover, it's free.",""],["therefore","/ˈðeəfɔː/","поэтому, следовательно","Therefore, we need a backup.",""],["instead","/ɪnˈsted/","вместо этого","Use Linux instead.",""]],"quiz":[["___ it was late, we continued working.","Although","However","Therefore","although + предложение."],["It's fast. ___, it's expensive.","However","Although","Because","However — однако."],["It's free and reliable. ___, it's open source.","Moreover","Instead","Although","Moreover — кроме того."]],"tr":[["Хотя это бесплатно, это надёжно.",["Although it's free, it's reliable.","Although it is free, it is reliable."]],["Это работает. Однако это медленно.",["It works. However, it's slow.","It works. However, it is slow."]],["Используй SSH вместо Telnet.",["Use SSH instead of Telnet."]]],"task":"Напиши аргументированное мнение (6–8 предложений): удалённая работа — плюс или минус? Используй связки урока."},{"type":"R","title":"Итоги недели 13","topic":"","focus":"","keys":[],"words":[],"quiz":[],"tr":[["Если бы я мог, я бы работал удалённо.",["If I could, I would work remotely.","If I could, I'd work remotely."]],["Если бы он прочитал инструкцию, он бы не сломал роутер.",["If he had read the instructions, he wouldn't have broken the router.","If he had read the manual, he would not have broken the router."]],["Жаль, что я не умею рисовать.",["I wish I could draw."]],["Хотя было трудно, мы справились.",["Although it was difficult, we managed.","Although it was hard, we did it."]]],"task":"Напиши текст (8 предложений) «Если бы я начинал учёбу заново»: что бы сделал иначе, о чём жалеешь, что сделаешь в будущем."}]},{"title":"Финал: English для DevSecOps","desc":"Всё вместе в рабочих задачах","lessons":[{"type":"L","title":"Отчёт об инциденте","topic":"past","focus":"Финальная неделя — всё вместе на реальных задачах. Отчёт об инциденте объединяет все прошедшие времена: процесс (Past Continuous), события (Past Simple), предыстория (Past Perfect), результат сейчас (Present Perfect).","keys":[["was V-ing · V-ed · had V3 · have V3","We detected suspicious traffic. The attacker had already got access."]],"words":[["detect","/dɪˈtekt/","обнаруживать","We detected an attack.",""],["suspicious","/səˈspɪʃəs/","подозрительный","I saw suspicious traffic.",""],["contain","/kənˈteɪn/","сдерживать; содержать","We contained the attack.",""],["recover","/rɪˈkʌvə/","восстанавливать(ся)","We recovered the data.",""],["affected","/əˈfektɪd/","затронутый","Two servers were affected.",""]],"quiz":[],"tr":[["Мы обнаружили подозрительный трафик в 3 часа ночи.",["We detected suspicious traffic at 3 am.","We detected suspicious traffic at three in the morning.","We detected suspicious traffic at 3 a.m."]],["Злоумышленник уже получил доступ к двум серверам.",["The attacker had already got access to two servers.","The attacker had already gained access to two servers.","The attacker has already got access to two servers."]],["Мы восстановили все данные.",["We have recovered all the data.","We recovered all the data."]]],"task":"Напиши полный отчёт об инциденте (8–10 предложений): обнаружение, хронология, затронутые системы, действия, результат."},{"type":"L","title":"Описание системы","topic":"passive","focus":"Описание архитектуры: Present Simple — как работает, пассив — что происходит с данными, which/that — детали.","keys":[["is handled by · consists of · which/that","Each request is handled by the gateway."]],"words":[["architecture","/ˈɑːkɪtektʃə/","архитектура","Describe the architecture.",""],["component","/kəmˈpəʊnənt/","компонент","Each component has a role.",""],["handle","/ˈhændl/","обрабатывать","This service handles requests.",""],["route","/ruːt/","маршрутизировать; маршрут","The gateway routes traffic.",""],["isolated","/ˈaɪsəleɪtɪd/","изолирован {id:"ps",lvl:"A1",title:"Present Simple",sub:"факты и привычки",

{id:"pc",lvl:"A1",title:"Present Continuous",sub:"прямо сейчас",

{id:"psvspc",lvl:"A1",title:"Simple или Continuous",sub:"обычно vs сейчас + глаголы состояния",
 intro:"Present Simple — обычно, всегда, факт. Present Continuous — сейчас, временно. Глаголы состояния (know, like, want, need, believe, understand, belong, own, mean) почти никогда не ставятся в Continuous.",
 forms:[["PS","обычно / факт","I usually work from home."],["PC","сейчас / временно","Today I'm working in the office."],["!","глаголы состояния → Simple","I know. I need it. I don't understand."]],
 uses:[["think: мнение → Simple, процесс → Continuous","I think it's a bug. / I'm thinking about it."],["have: владеть → Simple, действие → Continuous","I have a laptop. / I'm having lunch."]],
 markers:"PS: usually, every day · PC: now, today, this week",notes:[],

{id:"can",lvl:"A1",title:"can / could",sub:"умею, могу, можно",

{id:"qwords",lvl:"A1",title:"Вопросы",sub:"Wh-вопросы и вопросы к подлежащему",

{id:"past",lvl:"A1",title:"Past Simple",sub:"закончилось в прошлом",

function todayStr(d=new Date()){const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return todayStr(d)}
function mkWord(w,ipa,ru,ex,forms,status,box){
  return {id:w.toLowerCase().trim(),w,ipa:ipa||"",ru:ru||"",ex:ex||"",forms:forms||"",status,box,due:addDays(INTERVALS[box]||0),added:Date.now()};
}
function fresh(){
  return {v:1,updated:0,
    words:KNOWN.map((k,i)=>{const w=mkWord(k[0],k[1],k[2],"","","learned",3);w.due=addDays(1+(i%7));return w;}),
    gdone:[...DONE_DEFAULT], gbest:{}, gcur:"pp", custom:[], streak:{n:0,last:""}, course:{from:0,done:{},last:""}};
}
function normalize(s){if(!s.gcur)s.gcur="pp";if(!s.gbest)s.gbest={};if(!s.custom)s.custom=[];if(!s.streak)s.streak={n:0,last:""};if(!s.course)s.course={from:0,done:{},last:""};return s}

let REMOTE=null, writing=false, pending=false, saveTimer=null, retried=false, downloads=null;
let SYNC="Локально";
function setSync(t){SYNC=t;document.querySelectorAll(".syncst").forEach(el=>{el.textContent=t;el.dataset.s=t})}
function save(){
  S.updated=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  clearTimeout(saveTimer); saveTimer=setTimeout(flush,700);
}
async function flush(){
  if(!REMOTE)return;
  if(writing){pending=true;return}
  writing=true; setSync("Сохраняю…");
  try{await REMOTE.push(JSON.parse(JSON.stringify(S)));retried=false;setSync("Сохранено")}
  catch(e){
    if(!retried&&navigator.onLine!==false){retried=true;writing=false;setTimeout(flush,1500+Math.random()*1500);return}
    setSync(navigator.onLine===false?"Нет сети · локально":"Локально");
  }
  writing=false;
  if(pending){pending=false;flush()}
}
function adopt(d){
  S=normalize(JSON.parse(JSON.stringify(d)));
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  if(UI.lesson&&!LESSONS[UI.lesson.i])UI.lesson=null;
  render();
}
async function pullRemote(){
  if(!REMOTE||writing)return;
  try{const d=await REMOTE.pull();
    if(d&&d.v===1&&(d.updated||0)>(S.updated||0)&&!UI.lesson){adopt(d);setSync("Синхронизировано")}
  }catch(e){}
}
async function connectRemote(r){
  REMOTE=r;
  try{const d=await r.pull();
    if(d&&d.v===1&&(d.updated||0)>=(S.updated||0)){adopt(d);setSync("Синхронизировано")}
    else await flush();
  }catch(e){setSync("Локально")}
}

function findWord(id){return S.words.find(x=>x.id===String(id).toLowerCase().trim())}
function upsertWord(o,status){
  let w=findWord(o.w);
  if(w){ Object.assign(w,{ipa:w.ipa||o.ipa,ru:w.ru||o.ru,ex:w.ex||o.ex,forms:w.forms||o.forms});
    if(status==="learned"&&w.status!=="learned"){w.status="learned";w.box=Math.max(w.box,2);w.due=addDays(INTERVALS[w.box])}
    return w;}
  w=mkWord(o.w,o.ipa,o.ru,o.ex,o.forms,status,status==="learned"?2:0);
  S.words.unshift(w); return w;
}

function buildLearnQuiz(){
  const L=UI.learn;

    const wrong=shuffle(pool.filter(r=>r!==c.ru)).slice(0,3);
    return {...c,opts:shuffle([c.ru,...wrong]),pick:null,ok:false};
  });
  L.quiz={items,i:0};
}

async function getSample(){const s=await samplePromise;if(!s)throw{code:"none"};return s}
function aiErr(e){
  if(e&&e.code==="none")return "Claude здесь недоступен — заполни вручную.";
  if(e&&e.code==="not_granted")return "Доступ к Claude не разрешён для этой страницы.";
  if(e&&e.code==="rate_limited")return "Слишком много запросов. Подожди минуту.";
  return "Не получилось получить ответ. Попробуй ещё раз.";
}
async function aiFill(){

  if(lib){UI.dict.draft={w:lib.w,ipa:lib.ipa,ru:lib.ru,ex:lib.ex};UI.dict.draftForms=lib.forms;render();const m=$("#aiFillMsg");if(m)m.textContent="Нашёл в библиотеке. Проверь и сохрани.";return}
  msg.textContent="Claude ищет транскрипцию…";
  try{
    const s=await getSample();
    const r=await s.json(`Ты англо-русский словарь для студента уровня A1, который изучает IT и кибербезопасность.
Слово или фраза: "${d.w}"
Верни ТОЛЬКО JSON без пояснений:
{"word":"слово (исправь опечатку, если есть; в нижнем регистре, кроме имён собственных)","ipa":"британская транскрипция IPA в слэшах, например /ˈsɜːvə/","ru":"1–3 коротких перевода через запятую","example":"простое предложение уровня A1–A2, лучше из IT-контекста","forms":"для неправильного глагола три формы через ' – ', иначе пустая строка"}`,{modelTier:"quick"});
    UI.dict.draft={w:r.word||d.w,ipa:r.ipa||"",ru:r.ru||"",ex:r.example||""};

  }catch(e){msg.textContent=aiErr(e)}

async function aiPack(){
  const topic=$("#aiTopic").value.trim(); const msg=$("#aiPackMsg"); msg.hidden=false;
  if(!topic){msg.textContent="Напиши тему.";return}
  msg.textContent="Claude подбирает слова… это займёт несколько секунд.";
  const known=[...new Set([...S.words.map(w=>w.w),...allPacks().flatMap(p=>p.words.map(w=>w[0]))])].join(", ");
  try{
    const s=await getSample();
    const r=await s.json(`Подбери 10 полезных английских слов или коротких фраз по теме "${topic}" для студента уровня A1–A2, будущего DevSecOps-инженера.
Не включай эти слова, они уже есть: ${known}
Верни ТОЛЬКО JSON-массив из 10 объектов:
[{"word":"...","ipa":"британская IPA в слэшах","ru":"короткий перевод","example":"простое предложение A1–A2"}]`,{modelTier:"quick"});
    const arr=(Array.isArray(r)?r:r.words||[]).filter(x=>x&&x.word).slice(0,12);
    if(!arr.length)throw{};
    const p={id:"c"+Date.now(),title:topic.charAt(0).toUpperCase()+topic.slice(1),desc:"Свой набор",words:arr.map(x=>[String(x.word),String(x.ipa||""),String(x.ru||""),String(x.example||"")])};
    S.custom.push(p); save(); startPack(p.id);

}

/* --- normalizer for translations --- */
const NUMW={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,fifteen:15,twenty:20,thirty:30,hundred:100};
function norm(s){
  s=" "+String(s).toLowerCase().replace(/[’‘`]/g,"'")+" ";
  s=s.replace(/\bwon't\b/g,"will not").replace(/\bcan't\b|\bcannot\b/g,"can not").replace(/\bshan't\b/g,"shall not")
     .replace(/n't\b/g," not").replace(/'m\b/g," am").replace(/'re\b/g," are").replace(/'ve\b/g," have").replace(/'ll\b/g," will").replace(/'d\b/g," would")
     .replace(/\b(it|that|what|he|she|there|here|who|where|how|everything|nothing)'s\b/g,"$1 is").replace(/\blet's\b/g,"let us");
  s=s.replace(/a\.m\./g,"am").replace(/p\.m\./g,"pm").replace(/[.,!?;:"«»()—–\-]/g," ");
  s=s.replace(/\b(practice|practicing|practiced)\b/g,m=>m.replace("c","s")).replace(/\brealiz/g,"realis").replace(/\bneighbor/g,"neighbour").replace(/\bcolor/g,"colour").replace(/\bcyber security\b/g,"cybersecurity").replace(/\bok\b/g,"okay");
  s=s.replace(/\b[a-z]+\b/g,w=>NUMW[w]!=null?String(NUMW[w]):w);
  return s.replace(/\s+/g," ").trim();
}
function trMatch(ans,alts){const a=norm(ans);return alts.some(x=>norm(x)===a)}

/* --- lesson runner --- */
function startLesson(i){
  const l=LESSONS[i]; if(!l)return;
  const steps=["theory"];
  if(l.type==="L")steps.push("words");
  steps.push("wquiz","gquiz","tr","write");
  const own=new Set((l.type==="L"?l.words:weekLessons(l).flatMap(x=>x.words)).map(w=>w[0].toLowerCase()));
  const rev=shuffle(dueWords().filter(w=>!own.has(w.id))).slice(0,5).map(w=>w.id);
  if(rev.length)steps.push("review");
  steps.push("done");
  // word quiz
  const qWords=l.type==="L"?l.words:shuffle(weekLessons(l).flatMap(x=>x.words)).slice(0,8);
  const poolRu=[...new Set(LESSONS.flatMap(x=>x.words.map(w=>w[2])))], poolEn=[...new Set(LESSONS.flatMap(x=>x.words.map(w=>w[0])))];
  const wq=shuffle(qWords).map((w,k)=>{const en=k%3!==2;
    const right=en?w[2]:w[0], pool=(en?poolRu:poolEn).filter(x=>x!==right);
    return {w,en,right,opts:shuffle([right,...shuffle(pool).slice(0,3)]),pick:null,ok:false}});
  // grammar quiz
  let gq=[];
  if(l.type==="L"){gq=[...l.quiz];const t=topicOf(l);if(t)gq=gq.concat(shuffle(t.quiz));gq=gq.slice(0,5)}
  else{const wk=weekLessons(l);let pool=[];wk.forEach(x=>{pool=pool.concat(x.quiz);const t=topicOf(x);if(t)pool=pool.concat(shuffle(t.quiz).slice(0,2))});
    const uniq=[];const seen=new Set();shuffle(pool).forEach(q=>{if(!seen.has(q[0])){seen.add(q[0]);uniq.push(q)}});gq=uniq.slice(0,7)}
  gq=gq.map(q=>({q:q[0],a:q[1],why:q[4],opts:shuffle([q[1],q[2],q[3]]),pick:null,ok:false}));
  UI.tab="course";
  UI.lesson={i,steps,step:0,wq,wqi:0,gq,gqi:0,tr:l.tr.map(t=>({ru:t[0],alts:t[1],val:"",state:null,ai:""})),tri:0,txt:(cstate().done[i]||{}).txt||"",ai:"",rev,revi:0,revShown:false,revOk:0,saved:false};
  if(l.type==="L")l.words.forEach(w=>{const x=findWord(w[0]);if(!x)upsertWord({w:w[0],ipa:w[1],ru:w[2],ex:w[3],forms:w[4]},"learning")});
  save(); render(); scrollTo(0,0);
}
const STEPNAME={theory:"Теория",words:"Слова",wquiz:"Проверка слов",gquiz:"Грамматика",tr:"Перевод",write:"Письмо",review:"Повторение",done:"Итог"};
function lessonScore(){const L=UI.lesson;const w=L.wq.filter(x=>x.ok).length,g=L.gq.filter(x=>x.ok).length,t=L.tr.filter(x=>x.state==="ok").length;return {s:w+g+t,m:L.wq.length+L.gq.length+L.tr.length}}
function nextStep(){const L=UI.lesson;L.step=Math.min(L.step+1,L.steps.length-1);if(L.steps[L.step]==="done")finishLesson();render();scrollTo(0,0)}
function finishLesson(){
  const L=UI.lesson;if(L.saved)return;L.saved=true;
  const l=LESSONS[L.i],c=cstate(),sc=lessonScore();
  L.wq.forEach(q=>{const w=findWord(q.w[0]);if(!w)return;if(q.ok){if(w.box<1){w.box=1;w.due=addDays(1)}}else{w.box=0;w.due=todayStr();w.status="learning"}});
  const prev=c.done[L.i];
  c.done[L.i]={d:todayStr(),s:Math.max(sc.s,prev?prev.s:0),m:sc.m,txt:L.txt||(prev&&prev.txt)||""};
  if(!prev)c.last=todayStr();
  UI.early=false;
  touchDay();save();
}

const IRRF={};IRR.forEach(r=>{[r[2],r[3]].forEach(f=>f.split("/").map(x=>x.trim().toLowerCase()).filter(x=>/^[a-z]+$/.test(x)).forEach(x=>{if(x!==r[0])IRRF[x]=IRRF[x]||r[0]}))});
function lexicon(){
  const m=new Map();const put=(w,ipa,ru,ex,forms)=>{if(!w||!ru)return;const k=w.toLowerCase().replace(/[?!]$/,"");if(!m.has(k))m.set(k,{w,ipa:ipa||"",ru,ex:ex||"",forms:forms||""})};
  S.words.forEach(x=>put(x.w,x.ipa,x.ru,x.ex,x.forms));
  LESSONS.forEach(l=>l.words.forEach(w=>put(...w)));
  allPacks().forEach(p=>p.words.forEach(w=>put(...w)));
  KNOWN.forEach(k=>put(k[0],k[1],k[2]));
  IRR.forEach(r=>put(r[0],r[1],r[4],"",`${r[0]} – ${r[2]} – ${r[3]}`));
  Object.keys(WT_CACHE).forEach(k=>{const e=WT_CACHE[k];put(e.w,e.ipa,e.ru,e.ex)});
  return m;
}
const WT_CACHE={};
const WT_SPECIAL={better:"good",best:"good",worse:"bad",worst:"bad",children:"child",men:"man",women:"woman",feet:"foot",teeth:"tooth",mice:"mouse",knives:"knife",am:"be",is:"be",are:"be",was:"be",were:"be",been:"be",has:"have",had:"have",does:"do",did:"do"};
function lemmaCands(w){
  const c=[w];const add=x=>{if(x&&x.length>1&&!c.includes(x))c.push(x)};
  add(w.replace(/'s$/,""));
  if(IRRF[w])add(IRRF[w]);
  if(w.endsWith("ies"))add(w.slice(0,-3)+"y");
  if(w.endsWith("es"))add(w.slice(0,-2));
  if(w.endsWith("s"))add(w.slice(0,-1));
  if(w.endsWith("ied"))add(w.slice(0,-3)+"y");
  if(w.endsWith("ed")){add(w.slice(0,-2));add(w.slice(0,-1));if(/(.)\1ed$/.test(w))add(w.slice(0,-3))}
  if(w.endsWith("ing")){add(w.slice(0,-3));add(w.slice(0,-3)+"e");if(/(.)\1ing$/.test(w))add(w.slice(0,-4));if(w.endsWith("ying"))add(w.slice(0,-4)+"ie")}
  if(w.endsWith("ier"))add(w.slice(0,-3)+"y");if(w.endsWith("iest"))add(w.slice(0,-4)+"y");
  if(w.endsWith("er")){add(w.slice(0,-2));add(w.slice(0,-1));if(/(.)\1er$/.test(w))add(w.slice(0,-3))}
  if(w.endsWith("est")){add(w.slice(0,-3));add(w.slice(0,-2));if(/(.)\1est$/.test(w))add(w.slice(0,-4))}
  if(w.endsWith("ly"))add(w.slice(0,-2));
  if(WT_SPECIAL[w])add(WT_SPECIAL[w]);
  return c;
}
function wordAt(x,y){
  let node,off;
  if(document.caretRangeFromPoint){const r=document.caretRangeFromPoint(x,y);if(!r)return null;node=r.startContainer;off=r.startOffset}
  else if(document.caretPositionFromPoint){const p=document.caretPositionFromPoint(x,y);if(!p)return null;node=p.offsetNode;off=p.offset}
  if(!node||node.nodeType!==3)return null;
  const t=node.textContent,re=/[A-Za-z][A-Za-z'’]*(?:-[A-Za-z]+)*/g,all=[];let m;
  while((m=re.exec(t)))all.push({s:m.index,e:m.index+m[0].length,w:m[0].replace(/’/g,"'")});
  const i=all.findIndex(a=>off>=a.s&&off<=a.e);if(i<0)return null;
  // make sure the tap is really on the word, not at line end
  try{const rg=document.createRange();rg.setStart(node,all[i].s);rg.setEnd(node,all[i].e);const rects=[...rg.getClientRects()];if(!rects.some(b=>x>=b.left-4&&x<=b.right+4&&y>=b.top-4&&y<=b.bottom+4))return null}catch(e){}
  return {words:all.map(a=>a.w),i,text:t};
}
function wtLookup(hit){
  const L=lexicon(),ws=hit.words.map(w=>w.toLowerCase()),i=hit.i;
  for(let len=4;len>=2;len--){
    const starts=[];for(let s=i;s>=Math.max(0,i-len+1);s--)if(s+len<=ws.length)starts.push(s);
    for(const s of starts){const parts=ws.slice(s,s+len);
      for(const first of lemmaCands(parts[0])){const ph=[first,...parts.slice(1)].join(" ");const e=L.get(ph);if(e)return {e,form:null,phrase:true}}}
  }
  const w=ws[i].replace(/'$/,"");
  for(const c of lemmaCands(w)){const e=L.get(c);if(e)return {e,form:c!==w?w:null,irr:IRRF[w]===c}}
  return null;
}

    <p class="small muted">${online?(REMOTE.kind==="supabase"?"Прогресс хранится в Supabase и одинаковый на всех устройствах, где ты вошёл в аккаунт.":"Прогресс хранится в твоём аккаунте Claude и одинаковый на телефоне и компьютере. Открой приложение по той же ссылке на любом устройстве — всё подтянется."):(SB_MODE?"Сейчас данные сохраняются только в этом браузере. Войди в аккаунт выше, чтобы включить синхронизацию.":"Сейчас данные сохраняются только в этом браузере.")}</p>
    ${online?`<button class="btn" data-ds="sync">Синхронизировать сейчас</button>`:""}</div>
   <div class="panel stack" style="padding:14px"><b>Резервная копия</b>
    <p class="small muted">Сохрани весь прогресс в файл — курс, словарь, свои наборы, результаты тестов. Сейчас: ${esc(dsCounts(S))}.</p>
    <button class="btn" data-ds="export">Сохранить в файл</button>
    ${DS.imp?`<div class="note stack"><p>В файле${DS.date?" от "+esc(DS.date.slice(0,10)):""}: ${esc(dsCounts(DS.imp))}.</p><p class="small">Текущие данные будут заменены.</p>
      <div class="two"><button class="btn ${DS.armed?"primary":""}" data-ds="apply">${DS.armed?"Точно заменить":"Заменить мои данные"}</button><button class="btn ghost" data-ds="cancel">Отмена</button></div></div>`
     :`<button class="btn ghost" data-ds="pick">Загрузить из файла…</button>`}
    ${DS.err?`<p class="small" style="color:var(--bad)">${esc(DS.err)}</p>`:""}
    <input type="file" id="dsfile" accept=".json,application/json" hidden></div>
  </div>`;
}
async function dsExport(){
  const str=JSON.stringify({app:"english-trainer",version:1,exportedAt:new Date().toISOString(),data:S},null,1);
  const filename=`english-${todayStr()}.json`;
  if(downloads){
    try{await downloads.save({filename,data:str});toast("Файл сохранён")}
    catch(e){if(e&&e.code==="declined")return;if(e&&e.code==="rate_limited"){toast("Подожди пару секунд и попробуй снова");return}toast("Не удалось сохранить файл")}
    return;
  }
  try{const url=URL.createObjectURL(new Blob([str],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast("Файл сохранён")}
  catch(e){toast("Не удалось сохранить файл")}
}
function dsRead(file){
  DS.err="";DS.imp=null;DS.armed=false;
  const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);const d=j&&j.app==="english-trainer"?j.data:null;
      if(!d||d.v!==1||!Array.isArray(d.words))throw 0;DS.imp=normalize(d);DS.date=j.exportedAt||null}
    catch(e){DS.err="Это не файл этого приложения. Выбери файл english-….json, сохранённый через «Сохранить в файл»."}
    renderDS()};
  r.onerror=()=>{DS.err="Не удалось прочитать файл.";renderDS()};
  r.readAsText(file);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-ds]");if(!b)return;const a=b.dataset.ds;
  if(a==="close"){DS.open=false;DS.imp=null;renderDS()}
  if(a==="export")dsExport();
  if(a==="pick")$("#dsfile").click();
  if(a==="cancel"){DS.imp=null;DS.armed=false;renderDS()}
  if(a==="sync"){(async()=>{await pullRemote();await flush();toast("Готово")})()}
  if(a==="apply"){if(!DS.armed){DS.armed=true;renderDS();return}
    S=DS.imp;DS.imp=null;DS.open=false;UI.lesson=null;save();render();renderDS();toast("Данные загружены")}
});
document.addEventListener("change",e=>{if(e.target.id==="dsfile"&&e.target.files[0])dsRead(e.target.files[0])});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&DS.open){DS.open=false;renderDS()}});

const SB_MODE=!!(window.supabase&&window.supabase.createClient&&!(window.claude&&window.claude.use));
let SB=null,SB_USER=null,SB_MSG="",SB_BUSY=false,SB_EMAIL="";
if(SB_MODE){
  SB=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:"eng-trainer-auth"}});
  SB.auth.getSession().then(({data})=>{if(data&&data.session)sbOnUser(data.session.user)}).catch(()=>{});
  SB.auth.onAuthStateChange((ev,session)=>{

    if(ev==="SIGNED_OUT"){SB_USER=null;REMOTE=null;setSync("Локально");render();renderDS()}
  });

async function sbOnUser(u){
  if(SB_USER&&SB_USER.id===u.id)return;
  SB_USER=u;
  await connectRemote({kind:"supabase",
    push:async d=>{const {error}=await SB.from("english_data").upsert({user_id:u.id,data:d,updated_at:new Date().toISOString()});if(error)throw error},
    pull:async()=>{const {data,error}=await SB.from("english_data").select("data").eq("user_id",u.id).maybeSingle();if(error)throw error;return data?data.data:null}});
  render();renderDS();
}
function sbErr(e){
  const m=String(e&&e.message||e||"").toLowerCase();
  if(m.includes("invalid login"))return "Неверная почта или пароль.";
  if(m.includes("email not confirmed"))return "Почта не подтверждена. Открой письмо от Supabase и перейди по ссылке, потом войди.";
  if(m.includes("already registered"))return "Такой аккаунт уже есть — нажми «Войти».";
  if(m.includes("password"))return "Пароль слишком простой: нужно минимум 6 символов.";
  if(m.includes("fetch")||m.includes("network"))return "Нет связи с сервером. Проверь интернет.";
  return "Не получилось: "+(e&&e.message||"ошибка");
}
async function sbAuth(mode){
  const email=SB_EMAIL=(($("#sbmail")||{}).value||"").trim(),pass=($("#sbpass")||{}).value||"";
  if(!email||!pass){SB_MSG="Введи почту и пароль.";renderDS();return}
  SB_BUSY=true;SB_MSG=mode==="up"?"Создаю аккаунт…":"Вхожу…";renderDS();
  try{
    if(mode==="up"){const {data,error}=await SB.auth.signUp({email,password:pass});if(error)throw error;
      SB_MSG=data.session?"Аккаунт создан.":"Аккаунт создан. Подтверди почту по ссылке из письма и нажми «Войти».";}
    else{const {error}=await SB.auth.signInWithPassword({email,password:pass});if(error)throw error;SB_MSG=""}
  }catch(e){SB_MSG=sbErr(e)}
  SB_BUSY=false;renderDS();
}
function sbPanel(){
  if(!SB_MODE)return "";
  if(SB_USER)return `<div class="panel stack" style="padding:14px"><div class="row between"><b>Аккаунт</b><button class="btn ghost" data-sb="out">Выйти</button></div>
    <p class="small muted">${esc(SB_USER.email||"")} · данные хранятся в Supabase. Это тот же аккаунт, что и в планере.</p></div>`;
  return `<div class="panel stack" style="padding:14px"><b>Вход в аккаунт</b>
    <p class="small muted">Войди тем же аккаунтом, что и в планере — прогресс будет синхронизироваться между устройствами через Supabase.</p>
    <input type="text" id="sbmail" value="${esc(SB_EMAIL)}" placeholder="Почта" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false">
    <input type="password" id="sbpass" placeholder="Пароль" autocomplete="current-password" style="width:100%;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px">
    <div class="two"><button class="btn primary" data-sb="in" ${SB_BUSY?"disabled":""}>Войти</button><button class="btn" data-sb="up" ${SB_BUSY?"disabled":""}>Создать аккаунт</button></div>
    ${SB_MSG?`<p class="small">${esc(SB_MSG)}</p>`:""}</div>`;
}
function sbBanner(){
  if(!SB_MODE||SB_USER)return "";
  return `<button class="next" data-act="dataSheet"><span class="k">Синхронизация выключена</span><br><b>Войти в аккаунт</b> <span class="muted">— чтобы прогресс был на всех устройствах</span></button>`;
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-sb]");if(!b)return;
  if(b.dataset.sb==="in")sbAuth("in");if(b.dataset.sb==="up")sbAuth("up");
  if(b.dataset.sb==="out"&&confirm("Выйти из аккаунта? Данные останутся на этом устройстве.")){SB.auth.signOut()}});
document.addEventListener("input",e=>{if(e.target.id==="sbmail")SB_EMAIL=e.target.value});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="sbpass"){e.preventDefault();sbAuth("in")}});

render();
